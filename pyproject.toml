[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medimg-twin"
version = "0.1.0"
description = "Medical Imaging Digital Twin Workflow Optimizer — SimPy + Gymnasium + PPO"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LJMU Thesis Research" }]
keywords = ["digital-twin", "reinforcement-learning", "medical-imaging", "simpy", "hospital-simulation"]

dependencies = [
    "simpy>=4.1.1",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.3.2",
    "torch>=2.3.0",
    "numpy>=2.0.0",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.37.0",
    "plotly>=5.23.0",
    "tensorboard>=2.17.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "tqdm>=4.66.4",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
medimg-generate = "medimg_twin.scripts.generate_dataset:app"
medimg-experiment = "medimg_twin.scripts.run_experiment:app"
medimg-train = "medimg_twin.scripts.train_ppo:app"
medimg-dashboard = "medimg_twin.scripts.launch_dashboard:app"

[tool.hatch.build.targets.wheel]
packages = ["src/medimg_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.coverage.run]
source = ["src/medimg_twin"]
omit = ["*/tests/*", "*/scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]
