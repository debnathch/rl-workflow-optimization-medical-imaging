# Starvation Test Config — Designed to demonstrate AdaptivePPO outperforms Priority
#
# Key difference from high_load.yaml:
#   urgent_ratio: 0.70  (was 0.20) — constant stream of urgents starves routines under Priority
#   emergency_ratio: 0.10 (was 0.12)
#   routine is the remainder: 1 - 0.70 - 0.10 = 0.20
#
# Under static Priority triage (Emergency=0, Urgent=1, Routine=2):
#   - 70% of arrivals are Urgent → near-constant Urgent queue → Routines never served
#   - Routine P95 wait: 120+ minutes (starvation)
#
# Under AdaptivePPO:
#   - Routines waiting > 45 min get promoted past urgents (anti-starvation)
#   - Routine P95 wait: ~60-80 minutes (meaningful improvement)
#   - Emergency TAT: unchanged (emergencies still served first)
#
# This demonstrates RL's multi-objective advantage:
#   Priority optimises ONE goal (emergency first)
#   AdaptivePPO optimises THREE goals (emergency TAT + routine starvation + fairness)

simulation:
  duration_minutes: 480
  seed: 42
  operating_hours:
    start: 6
    end: 22
  n_scanners:
    CT: 3
    MRI: 2
    XRAY: 4
  n_radiologists: 7

arrivals:
  routine_mean_iat: 2.0        # High load — 1 patient every 2 min
  emergency_ratio: 0.10        # 10% emergency
  urgent_ratio: 0.70           # 70% urgent  ← KEY: causes routine starvation under Priority
  diurnal_factors: [0.4, 0.6, 1.2, 1.4, 1.3, 0.7]
  weekend_multiplier: 0.65

modalities:
  distribution:
    CT: 0.45
    MRI: 0.30
    XRAY: 0.25
  setup_time:
    mean: 5.0
    sigma: 1.5
  scan_duration:
    CT:
      mean: 25.0
      sigma: 0.35
    MRI:
      mean: 45.0
      sigma: 0.40
    XRAY:
      mean: 12.0
      sigma: 0.30

radiologists:
  roster:
    - id: RAD001
      name: Dr. Smith
      specialty: body
      max_daily_reads: 40
      shift_start: 7
      shift_end: 19
    - id: RAD002
      name: Dr. Patel
      specialty: neuro
      max_daily_reads: 35
      shift_start: 8
      shift_end: 20
    - id: RAD003
      name: Dr. Johnson
      specialty: msk
      max_daily_reads: 40
      shift_start: 7
      shift_end: 19
    - id: RAD004
      name: Dr. Chen
      specialty: chest
      max_daily_reads: 45
      shift_start: 6
      shift_end: 18
    - id: RAD005
      name: Dr. Williams
      specialty: emergency
      max_daily_reads: 50
      shift_start: 6
      shift_end: 22
    - id: RAD006
      name: Dr. Brown
      specialty: body
      max_daily_reads: 40
      shift_start: 10
      shift_end: 22
    - id: RAD007
      name: Dr. Davis
      specialty: neuro
      max_daily_reads: 35
      shift_start: 9
      shift_end: 21
  reporting_duration:
    CT:
      mean: 20.0
      sigma: 0.40
    MRI:
      mean: 30.0
      sigma: 0.45
    XRAY:
      mean: 8.0
      sigma: 0.30
  emergency_priority_speedup: 0.6

rl:
  ppo:
    total_timesteps: 150000
    n_steps: 2048
    batch_size: 64
    learning_rate: 0.0003
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    eval_freq: 10000
    n_eval_episodes: 5
  reward_weights:
    wait_time: 1.0
    emergency_tat: 3.0
    utilization: 0.5
    workload_imbalance: 0.8
    throughput: 0.3
  step_duration_minutes: 5
  observation:
    max_queue_length: 50

dataset:
  n_patients: 100000
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  output_dir: "outputs/dataset"
  body_parts:
    CT:
      - ["Chest", 0.35]
      - ["Abdomen", 0.25]
      - ["Head", 0.20]
      - ["Pelvis", 0.10]
      - ["Spine", 0.10]
    MRI:
      - ["Brain", 0.30]
      - ["Spine", 0.25]
      - ["Knee", 0.20]
      - ["Shoulder", 0.15]
      - ["Abdomen", 0.10]
    XRAY:
      - ["Chest", 0.40]
      - ["Hand", 0.20]
      - ["Foot", 0.15]
      - ["Knee", 0.15]
      - ["Spine", 0.10]

analytics:
  output_dir: "outputs/experiments"
  figure_dpi: 150
  color_palette: "deep"
